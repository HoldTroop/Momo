[package]
name = "agent-bridge"
version = "1.0.0"
edition = "2021"
description = "Native Messaging host for Autonomous AI Agent"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
dashmap = "5.0"
messagepack = "0.11"
ruma-events = "0.28"
url = "2.0"
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
futures = "0.3"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
md-5 = "0.10"

# For local LLM
llama-cpp-2 = { version = "0.8", features = ["metal", "cuda"] }