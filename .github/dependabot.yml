version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Group all JS deps into a single PR each week so the project's review
    # gate isn't flooded with one PR per package.
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/bridge"
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns:
          - "*"
