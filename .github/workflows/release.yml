name: Release

# Publishes a GitHub Release whenever a version tag (v*) is pushed.
# - Builds the extension (dist/) and the native messaging host (best-effort)
# - Packages the extension into a zip
# - Creates a DRAFT release with auto-generated notes so a human can review
#   before publishing (this keeps the "review before publish" gate the project uses)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so changelog/notes tools can diff against the previous tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          zip -r "momo-extension-${GITHUB_REF_NAME}.zip" dist manifest.json icons

      # The Rust native host may require platform-specific toolchains
      # (e.g. CUDA / Metal for local LLM). Build it best-effort so a missing
      # local toolchain doesn't block publishing the extension itself.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native messaging host (best-effort)
        working-directory: bridge
        continue-on-error: true
        run: cargo build --release

      - name: Cargo test
        working-directory: bridge
        run: cargo test --all-features

      - name: Cargo clippy
        working-directory: bridge
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            momo-extension-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS binary
        working-directory: bridge
        run: cargo build --release

      - name: Import Developer ID Certificate
        if: secrets.DEVELOPER_ID_CERTIFICATE_BASE64 != ''
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Sign macOS binary
        working-directory: bridge
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          if [ -n "$DEVELOPER_ID_APPLICATION" ]; then
            codesign --sign "$DEVELOPER_ID_APPLICATION" --timestamp --options runtime --force --deep target/release/agent-bridge
          else
            echo "No Developer ID found, using ad-hoc signing"
            codesign --sign - --force --deep target/release/agent-bridge
          fi
          codesign --verify --verbose target/release/agent-bridge

      - name: Create notarization archive
        if: secrets.APPLE_ID != ''
        working-directory: bridge
        run: |
          mkdir -p notarize
          cp target/release/agent-bridge notarize/
          ditto -c -k --keepParent notarize/agent-bridge agent-bridge.zip

      - name: Notarize binary
        if: secrets.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: bridge
        run: |
          xcrun notarytool submit agent-bridge.zip --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple notarize/agent-bridge
          cp notarize/agent-bridge target/release/agent-bridge
          rm -rf notarize agent-bridge.zip

      - name: Create archive
        working-directory: bridge
        run: |
          tar -czf agent-bridge-macos-${GITHUB_REF_NAME}.tar.gz -C target/release agent-bridge

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: bridge/agent-bridge-macos-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
