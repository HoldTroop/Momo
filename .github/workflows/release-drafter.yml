name: Release Drafter

# Continuously maintains a draft release that auto-categorizes merged PRs by
# label (Breaking / Feature / Fix / Chore). When you're ready to ship, the
# release.yml workflow on a `v*` tag creates the actual release; this drafter
# gives you a living changelog to review (and mirrors CHANGELOG.md).

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Draft or update release notes
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
