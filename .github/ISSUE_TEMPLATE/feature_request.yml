name: 🚀 Feature request
description: Suggest a new feature or enhancement
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem and your proposed solution clearly.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Why is it valuable?
      placeholder: e.g. "The agent can't handle two-factor authentication pages today..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Describe the expected behavior.
      placeholder: e.g. "When a 2FA challenge is detected, pause and surface a human intervention modal..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How big is this change?
      options:
        - Small (single component)
        - Medium (multiple components)
        - Large (architectural / cross-cutting)

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references, related issues, or anything else helpful.
