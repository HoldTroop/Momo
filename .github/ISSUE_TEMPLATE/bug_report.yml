name: 🐛 Bug report
description: Report a bug or unexpected behavior
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more detail you provide, the faster we can fix it.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps to reproduce the behavior.
      placeholder: |
        1. Load the extension with `npm run build` and `chrome://extensions` → Load unpacked
        2. Start a task by typing "..."
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the extension is affected?
      options:
        - Service worker / orchestrator
        - Message router
        - CDP adapter
        - Content script (AX extractor / human input / DOM observer)
        - Offscreen document
        - Side panel (React UI)
        - Native messaging host (Rust bridge)
        - Policy engine
        - Persistence (IndexedDB / WAL)
        - LLM client
        - Other

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you running?
      placeholder: e.g. v0.2.0-legacy
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Chrome version, Node/Rust versions.
      placeholder: e.g. Linux, Chrome 126, Node 20, Rust 1.80

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste any console errors, offscreen logs, or bridge stdout.
      render: shell
