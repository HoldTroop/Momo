# Release Drafter configuration.
# Auto-categorizes merged PRs by label into a draft release.
# See https://github.com/release-drafter/release-drafter

# This project tags its release line as `vX.Y.Z-legacy`. Release Drafter's
# resolver reads `-legacy` as a semver *pre-release*, so a `patch` bump from
# `v0.2.0-legacy` would resolve to `0.2.0` and collide with the existing tag.
# To keep every draft on the `-legacy` line we append the suffix explicitly and
# drive everything except breaking changes through a `minor` bump (matching how
# this repo actually advances: v0.1.0-legacy -> v0.2.0-legacy -> ...).
name-template: 'v$RESOLVED_VERSION-legacy'
tag-template: 'v$RESOLVED_VERSION-legacy'

categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking-change'
      - 'breaking'
      - 'major'
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'minor'
  - title: '🐛 Fixes'
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
      - 'patch'
  - title: '🧰 Chore / Internal'
    labels:
      - 'chore'
      - 'refactor'
      - 'maintenance'
      - 'internal'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
      - 'docs'

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

# Skip the "(chore)" / "(fix)" prefixes already used by labels.
change-title-escapes: '\<*_&#@`'

# Map labels to semver bumps so the draft version resolves sensibly.
# Note: with the `-legacy` pre-release suffix, `patch` collides with the current
# tag, so fixes/chores/docs also advance through `minor` on this release line.
version-resolver:
  major:
    labels:
      - 'breaking-change'
      - 'breaking'
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
      - 'minor'
      - 'fix'
      - 'bug'
      - 'bugfix'
      - 'patch'
      - 'chore'
      - 'refactor'
      - 'maintenance'
      - 'documentation'
      - 'docs'
  default: minor

template: |
  ## What's Changed

  $CHANGES

  ---

  **How to install/build** — see `CONTRIBUTING.md` or the README.

  **Full diff:** https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION-legacy
