<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous AI Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117; color: #e6edf3;
      height: 100vh; display: flex; flex-direction: column;
    }
    #root { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 12px 16px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 12px; }
    .header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; text-transform: uppercase; }
    .status-badge.idle { background: #21262d; color: #8b949e; }
    .status-badge.running { background: #1f3a5f; color: #58a6ff; }
    .status-badge.error { background: #4d1a1a; color: #f85149; }
    .chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .message { display: flex; gap: 12px; max-width: 100%; }
    .message.user { flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .avatar.agent { background: #1f6feb; color: white; }
    .avatar.user { background: #238636; color: white; }
    .message-content { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; }
    .message.user .message-content { background: #1f6feb; color: white; border-bottom-right-radius: 4px; }
    .message.agent .message-content { background: #21262d; color: #e6edf3; border-bottom-left-radius: 4px; }
    .message-content pre { background: #0d1117; padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 8px 0; }
    .message-content code { font-family: 'SF Mono', Monaco, monospace; }
    .tool-call { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin: 8px 0; font-size: 12px; }
    .tool-call .name { color: #d2a8ff; font-weight: 600; }
    .tool-call .args { color: #8b949e; margin-top: 4px; }
    .tool-result { background: #0d2818; border: 1px solid #238636; border-radius: 8px; padding: 12px; margin: 8px 0; font-size: 12px; }
    .tool-result.error { background: #4d1a1a; border-color: #f85149; }
    .input-area { padding: 16px; border-top: 1px solid #30363d; }
    .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .input-field { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 14px; color: #e6edf3; font-size: 14px; resize: none; min-height: 44px; max-height: 120px; }
    .input-field:focus { outline: none; border-color: #1f6feb; }
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 500; font-size: 14px; cursor: pointer; border: none; transition: background 0.15s; }
    .btn.primary { background: #1f6feb; color: white; }
    .btn.primary:hover { background: #388bfd; }
    .btn.secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
    .btn.secondary:hover { background: #30363d; }
    .btn.danger { background: #da3633; color: white; }
    .btn.danger:hover { background: #f85149; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .session-list { padding: 16px; border-top: 1px solid #30363d; max-height: 200px; overflow-y: auto; }
    .session-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #161b22; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
    .session-item:hover { background: #21262d; }
    .session-info { display: flex; flex-direction: column; gap: 2px; }
    .session-goal { font-size: 13px; font-weight: 500; }
    .session-meta { font-size: 11px; color: #8b949e; }
    .empty-state { text-align: center; padding: 40px 20px; color: #8b949e; }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
    .typing-indicator { display: flex; gap: 4px; padding: 10px 14px; }
    .typing-indicator span { width: 8px; height: 8px; background: #58a6ff; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    .plan-view { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin: 8px 0; }
    .plan-step { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid #21262d; }
    .plan-step:last-child { border-bottom: none; }
    .plan-step.current { background: rgba(24, 90, 219, 0.1); border-radius: 6px; margin: -8px -12px; padding: 8px 12px; }
    .step-number { width: 24px; height: 24px; border-radius: 50%; background: #30363d; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .step-number.current { background: #1f6feb; color: white; }
    .step-number.done { background: #238636; color: white; }
    .step-info { flex: 1; }
    .step-action { font-weight: 500; font-size: 13px; }
    .step-details { font-size: 11px; color: #8b949e; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
