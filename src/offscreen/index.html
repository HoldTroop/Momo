<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agent Offscreen Document</title>
  <style>
    body { font-family: monospace; padding: 16px; background: #1a1a2e; color: #eee; }
    .status { padding: 8px; margin: 8px 0; border-radius: 4px; }
    .running { background: #0f3460; border-left: 4px solid #e94560; }
    .idle { background: #16213e; border-left: 4px solid #0f3460; }
    .log { max-height: 400px; overflow-y: auto; font-size: 12px; }
    .log-entry { padding: 2px 8px; border-bottom: 1px solid #0f3460; }
    .log-entry.error { color: #e94560; }
    .log-entry.warn { color: #f39c12; }
    .log-entry.info { color: #2ecc71; }
    .section { margin-bottom: 20px; }
    .section h3 { margin: 0 0 8px 0; color: #58a6ff; }
    .metric { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #0f3460; }
    .kill-switch { background: #da3633; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 16px; }
    .kill-switch:hover { background: #f85149; }
  </style>
</head>
<body>
  <h1>🤖 Autonomous Agent Offscreen</h1>
  <div id="status" class="status idle">Initializing...</div>

  <div class="section">
    <h3>📊 Metrics</h3>
    <div id="metrics">
      <div class="metric"><span>Memory</span><span id="mem-metric">0 MB</span></div>
      <div class="metric"><span>Uptime</span><span id="uptime-metric">0s</span></div>
      <div class="metric"><span>LLM Worker</span><span id="llm-metric">Not started</span></div>
      <div class="metric"><span>Simulation Engine</span><span id="sim-metric">Not started</span></div>
    </div>
  </div>

  <div class="section">
    <h3>⚡ Kill Switch</h3>
    <p style="font-size: 12px; color: #8b949e;">Emergency stop for all offscreen processes</p>
    <button id="kill-switch" class="kill-switch">🛑 KILL ALL</button>
  </div>

  <div class="section">
    <h3>📝 Logs</h3>
    <div id="logs" class="log"></div>
  </div>

  <script type="module" src="./index.js"></script>
</body>
</html>
