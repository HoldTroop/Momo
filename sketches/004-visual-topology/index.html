<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo Architecture - Visual Topology</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: ui-monospace, SFMono-Regular, monospace;
            background: #121212;
            overflow: hidden;
            color: #e0e0e0;
        }
        
        svg {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        
        svg:active {
            cursor: grabbing;
        }
        
        .header {
            position: fixed;
            top: 20px;
            left: 30px;
            z-index: 1000;
            font-size: 12px;
            color: #ff6b35;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            pointer-events: none;
        }
        
        /* Links */
        .link {
            fill: none;
            stroke-linecap: round;
        }
        
        .link-primary {
            stroke: #ff6b35;
            stroke-width: 3px;
            filter: drop-shadow(0 0 8px rgba(255, 107, 53, 0.6));
            animation: pulse 2s ease-in-out infinite;
        }
        
        .link-data {
            stroke: #4a9eff;
            stroke-width: 2px;
            filter: drop-shadow(0 0 6px rgba(74, 158, 255, 0.4));
        }
        
        .link-secondary {
            stroke: #444;
            stroke-width: 1.5px;
            stroke-dasharray: 4,4;
            opacity: 0.4;
        }
        
        @keyframes pulse {
            0%, 100% { stroke-width: 3px; opacity: 1; }
            50% { stroke-width: 3.5px; opacity: 0.8; }
        }
        
        /* Nodes */
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .node:hover .node-shape {
            filter: drop-shadow(0 4px 12px rgba(255, 107, 53, 0.6));
            transform: scale(1.05);
        }
        
        .node-shape {
            transition: all 0.3s ease;
        }
        
        .node-hub .node-shape {
            fill: #1a1a1a;
            stroke: #ff6b35;
            stroke-width: 2px;
            filter: drop-shadow(0 0 12px rgba(255, 107, 53, 0.5));
        }
        
        .node-browser .node-shape {
            fill: #1a1a1a;
            stroke: #555;
            stroke-width: 1.5px;
        }
        
        .node-bridge .node-shape {
            fill: #1a1a1a;
            stroke: #ff6b35;
            stroke-width: 1.5px;
        }
        
        .node-data .node-shape {
            fill: #0d1117;
            stroke: #4a9eff;
            stroke-width: 2px;
            filter: drop-shadow(0 0 8px rgba(74, 158, 255, 0.3));
        }
        
        .node-util .node-shape {
            fill: #1a1a1a;
            stroke: #333;
            stroke-width: 1px;
        }
        
        .node-label {
            font-size: 11px;
            fill: #e0e0e0;
            text-anchor: middle;
            pointer-events: none;
            font-weight: 500;
        }
        
        .node-sublabel {
            font-size: 9px;
            fill: #888;
            text-anchor: middle;
            pointer-events: none;
        }
        
        .link-label {
            font-size: 9px;
            fill: #ff6b35;
            text-anchor: middle;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">Momo Architecture · Visual Topology</div>
    <svg id="canvas"></svg>
    
    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const svg = d3.select('#canvas')
            .attr('width', width)
            .attr('height', height);
        
        const g = svg.append('g');
        
        // Zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([0.3, 3])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });
        
        svg.call(zoom);
        
        // Data based on actual codebase
        const nodes = [
            // Browser layer
            { id: 'sidepanel', label: 'src/sidepanel', sub: 'React UI', type: 'browser', r: 40, fx: 200, fy: 200 },
            { id: 'sw', label: 'src/sw', sub: 'orchestrator · router', type: 'hub', r: 60, fx: 500, fy: 200 },
            { id: 'content', label: 'src/content', sub: 'perception', type: 'browser', r: 40, fx: 800, fy: 200 },
            { id: 'lib', label: 'src/lib', sub: 'tools · selector', type: 'util', r: 35, fx: 1000, fy: 250 },
            
            // Bridge layer
            { id: 'ws', label: 'bridge/src', sub: 'ws_server · main', type: 'hub', r: 60, fx: 500, fy: 500 },
            { id: 'policy', label: 'bridge/src', sub: 'policy.rs · 771 lines', type: 'hub', r: 55, fx: 300, fy: 700 },
            { id: 'llm', label: 'bridge/src', sub: 'llm.rs', type: 'bridge', r: 45, fx: 700, fy: 700 },
            
            // Data layer
            { id: 'idb', label: 'IndexedDB', sub: 'browser storage', type: 'data', r: 40, fx: 250, fy: 900 },
            { id: 'sqlite', label: 'SQLite', sub: 'audit log', type: 'data', r: 40, fx: 550, fy: 900 }
        ];
        
        const links = [
            // Primary flow (thick orange with glow)
            { source: 'sidepanel', target: 'sw', type: 'secondary' },
            { source: 'sw', target: 'ws', type: 'primary', label: 'ws://:9090' },
            { source: 'ws', target: 'policy', type: 'primary' },
            { source: 'policy', target: 'llm', type: 'primary' },
            
            // Tool calls (dotted grey)
            { source: 'sw', target: 'content', type: 'secondary' },
            { source: 'sw', target: 'lib', type: 'secondary' },
            { source: 'content', target: 'lib', type: 'secondary' },
            
            // Data persistence (blue)
            { source: 'sw', target: 'idb', type: 'data' },
            { source: 'policy', target: 'sqlite', type: 'data' }
        ];
        
        // Create arrow markers
        svg.append('defs').selectAll('marker')
            .data(['primary', 'data', 'secondary'])
            .enter().append('marker')
            .attr('id', d => `arrow-${d}`)
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 8)
            .attr('refY', 0)
            .attr('markerWidth', 6)
            .attr('markerHeight', 6)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,-5L10,0L0,5')
            .attr('fill', d => {
                if (d === 'primary') return '#ff6b35';
                if (d === 'data') return '#4a9eff';
                return '#444';
            });
        
        // Draw links with bezier curves
        const link = g.selectAll('.link')
            .data(links)
            .enter().append('path')
            .attr('class', d => `link link-${d.type}`)
            .attr('marker-end', d => `url(#arrow-${d.type})`);
        
        // Draw link labels
        const linkLabel = g.selectAll('.link-label')
            .data(links.filter(d => d.label))
            .enter().append('text')
            .attr('class', 'link-label')
            .text(d => d.label);
        
        // Draw nodes
        const node = g.selectAll('.node')
            .data(nodes)
            .enter().append('g')
            .attr('class', d => `node node-${d.type}`);
        
        node.append('circle')
            .attr('class', 'node-shape')
            .attr('r', d => d.r);
        
        node.append('text')
            .attr('class', 'node-label')
            .attr('dy', -5)
            .text(d => d.label);
        
        node.append('text')
            .attr('class', 'node-sublabel')
            .attr('dy', 10)
            .text(d => d.sub);
        
        // Force simulation with fixed positions
        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-800))
            .force('x', d3.forceX().x(d => d.fx).strength(0.3))
            .force('y', d3.forceY().y(d => d.fy).strength(0.3))
            .on('tick', ticked);
        
        function ticked() {
            // Update link paths with smooth bezier curves
            link.attr('d', d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const dr = Math.sqrt(dx * dx + dy * dy);
                
                // Calculate control point for curve
                const cx = (d.source.x + d.target.x) / 2;
                const cy = (d.source.y + d.target.y) / 2 - dr * 0.2;
                
                return `M${d.source.x},${d.source.y}Q${cx},${cy},${d.target.x},${d.target.y}`;
            });
            
            // Update link labels
            linkLabel
                .attr('x', d => {
                    const source = nodes.find(n => n.id === d.source.id || n.id === d.source);
                    const target = nodes.find(n => n.id === d.target.id || n.id === d.target);
                    return (source.x + target.x) / 2;
                })
                .attr('y', d => {
                    const source = nodes.find(n => n.id === d.source.id || n.id === d.source);
                    const target = nodes.find(n => n.id === d.target.id || n.id === d.target);
                    return (source.y + target.y) / 2 - 10;
                });
            
            // Update node positions
            node.attr('transform', d => `translate(${d.x},${d.y})`);
        }
        
        // Initial zoom to fit
        const bounds = g.node().getBBox();
        const fullWidth = bounds.width;
        const fullHeight = bounds.height;
        const midX = bounds.x + fullWidth / 2;
        const midY = bounds.y + fullHeight / 2;
        
        const scale = 0.8 / Math.max(fullWidth / width, fullHeight / height);
        const translate = [width / 2 - scale * midX, height / 2 - scale * midY];
        
        svg.call(zoom.transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
    </script>
</body>
</html>
